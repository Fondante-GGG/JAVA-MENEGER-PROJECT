<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{_layout :: layout('Students', ~{::section})}">
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Students</h1>
        <a class="btn btn-primary" th:href="@{/students/new}">New student</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Full name</th>
                    <th>Email</th>
                    <th>Access</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="4" class="text-muted">No students yet.</td>
                </tr>
                <tr th:each="s : ${students}">
                    <td th:text="${s.fullName()}">Name</td>
                    <td class="text-muted" th:text="${s.email()}">email</td>
                    <td>
                        <span class="badge text-bg-success" th:if="${s.hasAccess()}">Granted</span>
                        <span class="badge text-bg-secondary" th:if="${!s.hasAccess()}">Not granted</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/students/{id}/edit(id=${s.id()})}">Edit</a>
                        <form class="d-inline" method="post" th:action="@{/students/{id}/delete(id=${s.id()})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    onclick="return confirm('Delete this student?')">Delete</button>
                        </form>
                        <form class="d-inline" method="post" th:if="${!s.hasAccess()}"
                              th:action="@{/students/{id}/grant-access(id=${s.id()})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-success" type="submit">Grant</button>
                        </form>
                        <form class="d-inline" method="post" th:if="${s.hasAccess()}"
                              th:action="@{/students/{id}/revoke-access(id=${s.id()})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-warning" type="submit"
                                    onclick="return confirm('Revoke access for this student?')">Revoke</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
