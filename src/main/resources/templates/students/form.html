<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{_layout :: layout(${mode}=='create' ? 'New student' : 'Edit student', ~{::section})}">
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${mode}=='create' ? 'New student' : 'Edit student'">Student</h1>
        <a class="btn btn-outline-secondary" th:href="@{/students}">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post"
                  th:action="${mode}=='create' ? @{/students} : @{/students/{id}(id=${id})}"
                  th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label">Full name</label>
                    <input class="form-control" th:field="*{fullName}" placeholder="Ada Lovelace">
                    <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" th:field="*{email}" placeholder="ada@example.com">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <button class="btn btn-primary" type="submit" th:text="${mode}=='create' ? 'Create' : 'Save'">Save</button>
            </form>
        </div>
    </div>
</section>
</html>
