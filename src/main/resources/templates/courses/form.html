<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{_layout :: layout(${mode}=='create' ? 'New course' : 'Edit course', ~{::section})}">
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${mode}=='create' ? 'New course' : 'Edit course'">Course</h1>
        <a class="btn btn-outline-secondary" th:href="@{/courses}">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post"
                  th:action="${mode}=='create' ? @{/courses} : @{/courses/{id}(id=${id})}"
                  th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input class="form-control" th:field="*{title}" placeholder="Java Basics">
                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="5"
                              placeholder="What will students learn?"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <button class="btn btn-primary" type="submit" th:text="${mode}=='create' ? 'Create' : 'Save'">Save</button>
            </form>
        </div>
    </div>
</section>
</html>
