<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{_layout :: layout('Courses', ~{::section})}">
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Courses</h1>
        <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/courses/new}">New course</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th sec:authorize="hasRole('ADMIN')" class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(courses)}">
                    <td class="text-muted"
                        th:colspan="${#authorization.expression('hasRole(''ADMIN'')')} ? 3 : 2">No courses yet.</td>
                </tr>
                <tr th:each="c : ${courses}">
                    <td th:text="${c.title()}">Title</td>
                    <td class="text-muted" th:text="${c.description()}">Description</td>
                    <td sec:authorize="hasRole('ADMIN')" class="text-end">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/courses/{id}/edit(id=${c.id()})}">Edit</a>
                        <form class="d-inline" method="post" th:action="@{/courses/{id}/delete(id=${c.id()})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    onclick="return confirm('Delete this course?')">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
