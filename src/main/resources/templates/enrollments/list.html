<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{_layout :: layout('Enrollments', ~{::section})}">
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Enrollments</h1>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5">Enroll student</h2>
            <form class="row g-2" method="post" th:action="@{/enrollments}" th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-5">
                    <label class="form-label">Student</label>
                    <select class="form-select" th:field="*{studentId}">
                        <option th:each="s : ${students}" th:value="${s.id()}" th:text="${s.fullName()} + ' (' + s.email() + ')'"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></div>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Course</label>
                    <select class="form-select" th:field="*{courseId}">
                        <option th:each="c : ${courses}" th:value="${c.id()}" th:text="${c.title()}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('courseId')}" th:errors="*{courseId}"></div>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" type="submit">Enroll</button>
                </div>
            </form>
            <div class="alert alert-info mt-3 mb-0" th:if="${#lists.isEmpty(students) or #lists.isEmpty(courses)}">
                Create at least one student and one course first.
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Student</th>
                    <th>Course</th>
                    <th>Enrolled at</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(enrollments)}">
                    <td colspan="4" class="text-muted">No enrollments yet.</td>
                </tr>
                <tr th:each="e : ${enrollments}">
                    <td>
                        <div th:text="${e.studentName()}">Student</div>
                        <div class="text-muted small" th:text="${e.studentEmail()}">email</div>
                    </td>
                    <td th:text="${e.courseTitle()}">Course</td>
                    <td class="text-muted" th:text="${#temporals.format(e.enrolledAt(), 'yyyy-MM-dd HH:mm')}">time</td>
                    <td class="text-end">
                        <form class="d-inline" method="post" th:action="@{/enrollments/{id}/delete(id=${e.id()})}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    onclick="return confirm('Delete this enrollment?')">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
