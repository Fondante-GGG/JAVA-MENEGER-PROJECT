<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Kur'">Kur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/" th:href="@{/}">Kur</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/courses}">Courses</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/students}">Students</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')" th:href="@{/enrollments}">Enrollments</a>
        </div>

        <div class="d-flex align-items-center gap-2">
            <span class="text-white-50 small" sec:authorize="isAuthenticated()"
                  th:text="${#authentication.name}">user@example.com</span>
            <form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}" class="mb-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-sm btn-outline-light" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:replace="${content}"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
